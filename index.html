<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>Teacher Login | CLASSGUARD AI</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <main class="login-container">
    <div class="login-brand">
      <div class="brand-icon">✦</div>
      <div>
        <h2>CLASSGUARD AI</h2>
        <p>INTELLIGENT CLASSROOM SYSTEM</p>
      </div>
    </div>

    <section class="login-card">
      <div class="login-symbol">⌑</div>
      <h1>Welcome back</h1>
      <p class="description">
        Sign in to access your classroom dashboard.
      </p>

      <form id="loginForm">
        <label for="email">Teacher email</label>
        <input type="email" id="email" placeholder="Enter your email" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>

        <p id="loginError" class="error-message" role="alert"></p>

        <button type="submit" id="loginButton">
          Sign In <span>→</span>
        </button>
      </form>

      <div class="login-footer">
        <span>🔒</span> Authorized teachers only
      </div>
    </section>

    <footer>© 2026 CLASSGUARD AI</footer>
  </main>

  <script type="module" src="login.js"></script>
</body>

</html>
